<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="img/Teste-vocacional.ico">
    <title>Fase 2 | Teste Vocacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bodyQuest questionnaire-page">
    <header class="questionnaire-progress">
        <span>Fase 2 · Escolha do curso</span>
        <progress id="progress" max="7" value="1"></progress>
        <span id="question-counter">Pergunta 1 de 7</span>
    </header>
    <main id="questionnaire" class="questionnaire">
        <section class="questionnaire-card" aria-live="polite">
            <p class="questionnaire-label" id="group-label"></p>
            <h1 id="question-title"></h1>
            <div id="answer-options" class="questionnaire-options"></div>
        </section>
    </main>

    <script src="perguntas.js"></script>
    <script>
        const grupoSelecionado = localStorage.getItem('grupoSelecionado');
        const perguntasDoGrupo = FASE2[grupoSelecionado];
        let pontuacaoCursos;
        let indicePergunta = 0;

        if (!perguntasDoGrupo) {
            window.location.replace('quest1.html');
        } else {
            pontuacaoCursos = Object.fromEntries(GRUPOS[grupoSelecionado].cursos.map((curso) => [curso, 0]));
            document.getElementById('group-label').textContent = GRUPOS[grupoSelecionado].nome;
            document.getElementById('progress').max = perguntasDoGrupo.length;
            exibirPergunta();
        }

        function exibirPergunta() {
            const pergunta = perguntasDoGrupo[indicePergunta];
            document.getElementById('question-title').textContent = pergunta.pergunta;
            document.getElementById('question-counter').textContent = `Pergunta ${indicePergunta + 1} de ${perguntasDoGrupo.length}`;
            document.getElementById('progress').value = indicePergunta + 1;

            const opcoes = document.getElementById('answer-options');
            opcoes.replaceChildren();
            embaralhar(pergunta.opcoes).forEach((opcao) => {
                const botao = document.createElement('button');
                botao.className = 'questionnaire-option';
                botao.type = 'button';
                botao.textContent = opcao.texto;
                botao.addEventListener('click', () => responder(opcao.curso));
                opcoes.appendChild(botao);
            });
        }

        function responder(curso) {
            pontuacaoCursos[curso] += 1;
            indicePergunta += 1;

            if (indicePergunta < perguntasDoGrupo.length) {
                exibirPergunta();
                return;
            }

            const resultado = escolherCurso(grupoSelecionado, pontuacaoCursos);
            localStorage.setItem('pontuacaoCursos', JSON.stringify(pontuacaoCursos));
            localStorage.setItem('cursoSelecionado', resultado.vencedor);
            localStorage.setItem('cursoSegundo', resultado.segundo);
            localStorage.setItem('paginaResultado', resultado.pagina);
            window.location.href = 'stick/stick.html';
        }
    </script>
</body>
</html>
