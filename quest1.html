<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="img/Teste-vocacional.ico">
    <title>Fase 1 | Teste Vocacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bodyQuest questionnaire-page">
    <header class="questionnaire-progress">
        <span>Fase 1 · Descoberta do grupo</span>
        <progress id="progress" max="7" value="1"></progress>
        <span id="question-counter">Pergunta 1 de 7</span>
    </header>
    <main id="questionnaire" class="questionnaire">
        <section class="questionnaire-card" aria-live="polite">
            <p class="questionnaire-label">Escolha a alternativa que mais combina com você</p>
            <h1 id="question-title"></h1>
            <div id="answer-options" class="questionnaire-options"></div>
        </section>
    </main>

    <script src="perguntas.js"></script>
    <script>
        const pontuacaoGrupos = { GRP1: 0, GRP2: 0, GRP3: 0, GRP4: 0 };
        let indicePergunta = 0;

        localStorage.removeItem('pontuacaoCursos');
        localStorage.removeItem('cursoSelecionado');
        localStorage.removeItem('paginaResultado');

        function exibirPergunta() {
            const pergunta = FASE1[indicePergunta];
            document.getElementById('question-title').textContent = pergunta.pergunta;
            document.getElementById('question-counter').textContent = `Pergunta ${indicePergunta + 1} de ${FASE1.length}`;
            document.getElementById('progress').value = indicePergunta + 1;

            const opcoes = document.getElementById('answer-options');
            opcoes.replaceChildren();
            embaralhar(pergunta.opcoes).forEach((opcao) => {
                const botao = document.createElement('button');
                botao.className = 'questionnaire-option';
                botao.type = 'button';
                botao.textContent = opcao.texto;
                botao.addEventListener('click', () => responder(opcao.grupo));
                opcoes.appendChild(botao);
            });
        }

        function responder(grupo) {
            pontuacaoGrupos[grupo] += 1;
            indicePergunta += 1;

            if (indicePergunta < FASE1.length) {
                exibirPergunta();
                return;
            }

            const grupoSelecionado = escolherGrupo(pontuacaoGrupos);
            localStorage.setItem('pontuacaoGrupos', JSON.stringify(pontuacaoGrupos));
            localStorage.setItem('grupoSelecionado', grupoSelecionado);
            localStorage.setItem('pontuacao', JSON.stringify(pontuacaoGrupos));
            window.location.href = 'memory/memory.html';
        }

        exibirPergunta();
    </script>
</body>
</html>
